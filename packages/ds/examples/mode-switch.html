<!doctype html>
<html lang="en" data-wk-theme="neutral">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wakata colour mode (synthetic example)</title>
    <script type="module">
      import '@wakata/ds/themes.css';
      import '@wakata/ds/mode-switch/define';
      document.addEventListener('wk-mode-change', (event) => {
        document.querySelector('output').textContent =
          `Choice: ${event.detail.mode}; resolved: ${event.detail.resolvedMode}`;
      });
    </script>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--wk-surface);
        color: var(--wk-text);
        font-family: var(--wk-font);
      }
      main {
        display: grid;
        gap: 16px;
        max-width: 32rem;
        margin-inline: auto;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0;
      }
      section {
        padding: 12px;
        background: var(--wk-surface);
        color: var(--wk-text);
        font-family: var(--wk-font);
        border: 1px solid var(--wk-border);
      }
    </style>
  </head>
  <body>
    <!-- Serve with a bundler/dev server that resolves @wakata/ds. -->
    <main>
      <h1>Colour mode</h1>
      <p>Synthetic settings. System follows your device; Light and Dark persist on this site.</p>
      <wk-mode-switch></wk-mode-switch>
      <output aria-live="polite"></output>
      <section data-wk-theme="studio">
        <h2>Studio inherits the site mode</h2>
        <wk-mode-switch></wk-mode-switch>
      </section>
      <section data-wk-theme="fieldwork" data-wk-mode="light" data-wk-wireframe="true">
        <h2>Local light wireframe</h2>
        <p>This appearance stays light. Its control still changes the shared site choice.</p>
        <wk-mode-switch></wk-mode-switch>
      </section>
    </main>
  </body>
</html>
